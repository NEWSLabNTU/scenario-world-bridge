# The release (roadmap 082, "Cutting a release"): started by hand with the version, never by
# a pushed tag, so nothing publishes by accident. The tag is made last, on the commit built.
#
#   preflight -> build-sim -> links                                 (each per ROS distro:
#                          -> wheels -> smoke                        humble and jazzy)
#                          -> autoware-side                          (per Autoware release)
#                                                                    (stop_after: smoke, the default)
#     -> publish -> publish-ros-jazzy -> publish-colcon -> publish-scensim -> tag -> after
#                                                                    (stop_after: publish)
#
# Two ROS distros since 0.2.0: Humble (Ubuntu 22.04, Python 3.10) and Jazzy (Ubuntu 24.04,
# Python 3.12), each with its own sim tarball and release package (scensim-ros-<distro>);
# the front end and colcon-scensim are one wheel each, built in Humble's leg. There is no
# vehicle tarball: the car's Autoware packages are source (autoware-side.repos, attached to
# the GitHub Release), built in the user's Autoware workspace; autoware-side checks them
# against NEWSLab's Autoware binaries per release and ROS distro.
#
# One GitHub environment per PyPI project (PyPI refuses a second pending trusted publisher
# with the same repository, workflow and environment), and the dependencies first, so
# scensim never stands on PyPI without its pinned scensim-ros-humble: scensim-ros-humble in
# `pypi-scensim-ros-humble` (the user's approval: `publish` waits for it),
# scensim-ros-jazzy in `pypi-scensim-ros-jazzy`, colcon-scensim in `pypi-colcon-scensim`,
# scensim in `pypi`. Each job uploads only its own wheel. There is no
# TestPyPI stage (the user, 2026-11-18); `after` installs from PyPI, the first public install.
#
# The publishing jobs run only on main, only with stop_after: publish, and only once the
# repository variable SCENSIM_RELEASE_ENABLED is "true": the user sets that, the three GitHub
# environments (the user as required reviewer on `pypi-scensim-ros-humble` only) and the
# PyPI trusted publishers once (082, "What the user sets up once"). Until then every run
# stops after smoke.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (0.1.0); must match the pyproject files and docs/release-notes.md"
        required: true
        type: string
      stop_after:
        description: "Last stage to run; smoke publishes nothing"
        required: true
        default: smoke
        type: choice
        options: [smoke, publish]
      journey:
        description: "Smoke: testbench new, colcon build, testbench list (needs a release with the testbench commands, 081)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash   # also in the containers, whose default is sh

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DISTROS: humble jazzy   # every job with a ROS distro runs once per distro (matrix)
  ARCH: x86_64
  # The submodules the simulation side builds from (082 step 4); the two world servers carry
  # their own deps/ (the protocol, the spec, aib) as submodules, so those go in recursively.
  # sim_vehicle_ecu: scensim_isaac_world's exec_depend (isaac_world d678aa9), carried by the
  # sim set; the deps/ copies are COLCON_IGNOREd, so it needs its own checkout here.
  SIM_SUBMODULES: >-
    src/scenario_simulator_v2 src/color_names src/scensim_world_protocol
    src/scensim_carla_world src/scensim_isaac_world src/sim_vehicle_spec src/sim_vehicle_ecu
  # The vehicle side the sim set carries (build_sim.sh's SIM_PACKAGES: acb's bridge and the
  # car's descriptions). acb goes in recursively: acb_bridge builds against its
  # deps/sim_vehicle_spec. rosdep reads only these packages, not the whole repositories,
  # whose Autoware launch packages are not in the sim set.
  VEHICLE_SUBMODULES: src/autoware_carla_bridge src/autoware_sim_vehicle
  VEHICLE_PACKAGES: >-
    src/autoware_carla_bridge/src/acb_bridge
    src/autoware_sim_vehicle/cars/tesla_model3/tesla_model3_description
    src/autoware_sim_vehicle/cars/tesla_model3/tesla_model3_sensor_kit_description

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      publish_ok: ${{ steps.guard.outputs.publish_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The version
        env:
          STOP_AFTER: ${{ inputs.stop_after }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-]?(a|b|rc|dev)[0-9]*)?$ ]] \
            || { echo "::error::version '$VERSION' is not N.N.N[(a|b|rc|dev)N]"; exit 1; }
          bad=0
          check() {  # file, the version it holds
            if [ "$2" != "$VERSION" ]; then echo "::error file=$1::holds version '$2', not $VERSION"; bad=1; fi
          }
          v() { python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$1" 2>/dev/null \
                || sed -nE 's/^version *= *"?([^"]+)"?$/\1/p' "$1" | head -1; }
          check pypi/scensim/pyproject.toml "$(v pypi/scensim/pyproject.toml)"
          for d in $DISTROS; do
            check pypi/scensim-ros-$d/pyproject.toml "$(v pypi/scensim-ros-$d/pyproject.toml)"
          done
          check pypi/scensim/src/scensim_frontend/__init__.py \
            "$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' pypi/scensim/src/scensim_frontend/__init__.py)"
          for d in $DISTROS; do
            pin=$(grep -oE "scensim-ros-$d==[^;\"' ]+" pypi/scensim/pyproject.toml | cut -d= -f3)
            check "pypi/scensim/pyproject.toml (scensim-ros-$d pin)" "$pin"
          done
          if [ -f src/colcon_scensim/setup.cfg ]; then
            check src/colcon_scensim/setup.cfg "$(sed -nE 's/^version *= *//p' src/colcon_scensim/setup.cfg)"
          fi
          grep -qx "## v$VERSION" docs/release-notes.md \
            || { echo "::error file=docs/release-notes.md::no heading '## v$VERSION'"; bad=1; }
          # only a publishing run needs a version not released yet; a smoke run may build a
          # released one again
          if [ "$STOP_AFTER" = publish ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION exists already"; bad=1
          fi
          exit $bad
      - name: Pins and docs
        run: |
          git submodule update --init -- src/   # check_pins reads each component's committed deps/ pins
          python3 scripts/check_pins.py
          python3 scripts/check_docs.py
      - name: The front end's tests
        run: |
          # system-wide: the tests run the front end with HOME set to a scratch directory,
          # where a --user install is not seen
          sudo /usr/bin/python3 -m pip install -q pytest zstandard
          cd pypi/scensim && /usr/bin/python3 -m pytest -q tests
      - id: guard
        name: Whether this run may publish
        env:
          STOP_AFTER: ${{ inputs.stop_after }}
          ENABLED: ${{ vars.SCENSIM_RELEASE_ENABLED }}
        run: |
          ok=false
          if [ "$STOP_AFTER" != smoke ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::publishing runs only on main (this is $GITHUB_REF)"; exit 1; }
            [ "$ENABLED" = true ] || { echo "::error::SCENSIM_RELEASE_ENABLED is not 'true': the environments and trusted publishers are not set up (082)"; exit 1; }
            [ -f src/colcon_scensim/setup.cfg ] || { echo "::error::colcon-scensim (src/colcon_scensim, 081) is not on this commit"; exit 1; }
            ok=true
          fi
          echo "publish_ok=$ok" >> "$GITHUB_OUTPUT"
          echo "stop after: $STOP_AFTER; may publish: $ok" >> "$GITHUB_STEP_SUMMARY"

  build-sim:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      DISTRO: ${{ matrix.distro }}
      ROS_DISTRO_BUILD: ${{ matrix.distro }}
    container:
      image: ros:${{ matrix.distro }}
      # the runner's own toolchains, mounted to be deleted: the build needs the disk
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    steps:
      - name: Free disk
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* || true
          df -h / | tail -1
      - name: Tools
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq git curl zstd patchelf python3-pip python3-vcstool >/dev/null
          if [ "$DISTRO" != humble ]; then
            # carla-sys's bindings compile with libclang 14 only (build_sim.sh uses it when
            # present); Python 3.12 is externally managed (PEP 668): pip next to apt's packages
            apt-get install -y -qq libclang-14-dev >/dev/null
            export PIP_BREAK_SYSTEM_PACKAGES=1
          fi
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"   # GITHUB_PATH holds from the next step; maturin needs cargo now
          python3 -m pip install -q maturin
          # 889cb5c: --merge-install support (082 fix 1)
          python3 -m pip install -q --no-build-isolation \
            "git+https://github.com/jerry73204/colcon-cargo-ros2@889cb5c#subdirectory=packages/colcon-cargo-ros2"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive -- $SIM_SUBMODULES $VEHICLE_SUBMODULES
      - name: rosdep
        run: |
          set -e   # not -u: ROS's setup files read unset variables
          mkdir -p /tmp/vendor && vcs import --shallow --input sim.repos /tmp/vendor >/dev/null
          rosdep update -q --rosdistro "$DISTRO" >/dev/null
          source /opt/ros/$DISTRO/setup.bash
          if [ "$DISTRO" != humble ]; then
            # PEP 668: rosdep's pip keys install next to apt's packages, over the Debian-owned
            # dependencies they want newer (as the front end's rosdep line says on 3.11+)
            export PIP_BREAK_SYSTEM_PACKAGES=1 PIP_IGNORE_INSTALLED=1
          fi
          rosdep install --from-paths $SIM_SUBMODULES $VEHICLE_PACKAGES \
            src/scenario_world_bridge src/scenario_agent_relay \
            src/scensim src/scensim_launch src/scensim_interfaces src/scensim_examples src/scensim_agent \
            src/czp /tmp/vendor --ignore-src -y -q   # every key resolves (082 step 4): no -r, no skips
      - name: Build and stage
        run: |
          start=$(date +%s)
          scripts/release/build_sim.sh --version "$VERSION" --out dist --jobs "$(nproc)"
          echo "build-sim: $(( ($(date +%s) - start) / 60 )) min on $(nproc) cores; $(ls -s --block-size=M dist/*.tar.zst | head -1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-${{ matrix.distro }}
          path: dist/
          if-no-files-found: error

  links:
    needs: [preflight, build-sim]
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-22.04   # the link check starts its own clean container (ros:<distro>-ros-core)
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@v4
        with:
          name: tarballs-${{ matrix.distro }}
          path: dist
      # fails on: a rosdep line that leaves a key unresolved, a failed rosdep install, setup.sh
      # failing from sh after relocate.sh, an RPATH out of the prefix, a dangling or escaping
      # link, a missing interpreter or an env python shebang, an unresolved library or symbol
      - run: scripts/release/check_links.sh dist/scensim-sim-$VERSION-$DISTRO-$ARCH.tar.zst --out links
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-${{ matrix.distro }}
          path: links/

  wheels:
    needs: [preflight, build-sim]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: humble, python: "3.10"}
          - {distro: jazzy, python: "3.12"}
    runs-on: ubuntu-22.04
    env:
      DISTRO: ${{ matrix.distro }}
      PYVER: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: tarballs-${{ matrix.distro }}
          path: dist
      - name: Build
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          python3 -m pip install -q build
          tar=dist/scensim-sim-$VERSION-$DISTRO-$ARCH.tar.zst
          # the release's manifest names the GitHub Release's URLs
          python3 pypi/make_manifest.py --version "$VERSION" --distro "$DISTRO" \
            --base-url "https://github.com/$REPO/releases/download/v$VERSION" "$tar"
          python3 -m build --wheel -o wheels pypi/scensim-ros-$DISTRO
          # the front end and colcon-scensim know no distro: one wheel each, in Humble's leg
          if [ "$DISTRO" = humble ]; then
            python3 -m build --wheel -o wheels pypi/scensim
            if [ -f src/colcon_scensim/setup.cfg ]; then
              python3 -m build --wheel -o wheels src/colcon_scensim
            else
              echo "colcon-scensim: not on this commit (081); no wheel" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # the smoke test's manifest names the tarball served on localhost
          git checkout -- pypi/scensim-ros-$DISTRO
          python3 pypi/make_manifest.py --version "$VERSION" --distro "$DISTRO" \
            --base-url http://127.0.0.1:8765 "$tar"
          python3 -m build --wheel -o smoke-wheels pypi/scensim-ros-$DISTRO
          # the front end's own dependency, so that the smoke install needs no index
          python3 -m pip download -q -d smoke-wheels --only-binary=:all: \
            --python-version "$PYVER" --platform manylinux2014_x86_64 "zstandard>=0.21"
          ls wheels smoke-wheels >> "$GITHUB_STEP_SUMMARY"
      - name: Check the wheels' metadata
        # Ubuntu 22.04's pip 22 builds a pyproject package from an sdist as UNKNOWN-0.0.0,
        # so PyPI gets wheels only, each py3-none-any, with the name and version checked here.
        run: |
          python3 - "$VERSION" "$DISTRO" <<'EOF'
          import email.parser, re, sys, zipfile
          from pathlib import Path
          want = re.sub(r"[-_.]?(a|b|rc|dev)", r".\1", sys.argv[1]).replace("..", ".")
          want = re.sub(r"\.dev$", ".dev0", want)
          distro = sys.argv[2]
          expect = {f"scensim-ros-{distro}"}
          if distro == "humble":
              expect.add("scensim")
              if Path("src/colcon_scensim/setup.cfg").exists():
                  expect.add("colcon-scensim")
          bad = []
          for d in ("wheels", "smoke-wheels"):
              found = set()
              for f in Path(d).iterdir():
                  if f.name.startswith("zstandard-"):
                      continue
                  if f.suffix != ".whl":
                      bad.append(f"{d}/{f.name}: not a wheel (no sdist goes to PyPI)"); continue
                  if not f.name.endswith("-py3-none-any.whl"):
                      bad.append(f"{d}/{f.name}: not py3-none-any")
                  with zipfile.ZipFile(f) as z:
                      meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
                      m = email.parser.Parser().parsestr(z.read(meta).decode())
                  name = m["Name"].lower().replace("_", "-")
                  print(f"{d}/{f.name}: {name} {m['Version']}")
                  if name == "unknown" or m["Version"] != want:
                      bad.append(f"{d}/{f.name}: metadata {m['Name']} {m['Version']}, want version {want}")
                  found.add(name)
              need = expect if d == "wheels" else {f"scensim-ros-{distro}"}
              if found != need:
                  bad.append(f"{d}: wheels {sorted(found)}, want {sorted(need)}")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.distro }}
          path: wheels/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-wheels-${{ matrix.distro }}
          path: smoke-wheels/

  smoke:
    needs: [preflight, wheels]
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-22.04
    env:
      DISTRO: ${{ matrix.distro }}
    container:
      image: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: scripts/release
          path: src-release
      - uses: actions/download-artifact@v4
        with:
          name: tarballs-${{ matrix.distro }}
          path: /srv/release
      - uses: actions/download-artifact@v4   # the front end's wheel is Humble's leg's
        with:
          name: wheels-humble
          path: /tmp/release-wheels
      - uses: actions/download-artifact@v4
        with:
          name: smoke-wheels-${{ matrix.distro }}
          path: /tmp/wheels
      - name: Install from the job's files
        run: |
          set -eu
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip zstd >/dev/null
          # the release's front end, with the smoke test's manifest wheel (localhost URLs)
          cp /tmp/release-wheels/scensim-[0-9]*.whl /tmp/wheels/
          # Python 3.12 is externally managed (PEP 668): a --user install needs the flag
          [ "$DISTRO" = humble ] || export PIP_BREAK_SYSTEM_PACKAGES=1
          python3 -m pip install -q --user --no-index --find-links /tmp/wheels scensim
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The tarball relocates
        # unpacks under paths with spaces and shell characters, runs relocate.sh, sources
        # setup.sh from sh and setup.bash from bash, moves the prefix and repeats
        run: src-release/scripts/release/test_relocate.sh /srv/release/scensim-sim-$VERSION-$DISTRO-$ARCH.tar.zst
      - name: The first run
        shell: bash
        run: |
          set -euo pipefail
          (cd /srv/release && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          scensim --version
          scensim install 2>&1 | tee /tmp/install.txt   # its instructions go to stderr
          # the rosdep line the front end printed
          rosdep update -q --rosdistro "$DISTRO" >/dev/null
          # with the pip settings it prints on Python 3.11+ (PEP 668), without its sudo
          line=$(grep -oE '(PIP_[A-Z_]+=1 )*rosdep install .*' /tmp/install.txt | head -1)
          echo "rosdep: $line"
          eval "$line"   # exactly as printed: every key must resolve
          # the front end ran relocate.sh: colcon's sh scripts work from sh
          sh -c ". /opt/ros/$DISTRO/setup.sh && . $HOME/.local/share/scensim/current/sim/setup.sh"
          scensim --help
          scensim seat show
          echo "first run: ok ($(du -sh ~/.local/share/scensim | cut -f1) installed)" >> "$GITHUB_STEP_SUMMARY"
      - name: scensim setup as a user, ROS not sourced
        # roadmap 089: as on a workstation, a user with sudo and nothing sourced. The root
        # steps above, with ROS sourced, never saw sudo reset HOME and drop ROS_DISTRO, which
        # broke rosdep install for users (089 step 5). No Autoware here (--autoware none); the
        # container's kernel settings are read-only, so the DDS buffers line may stay FIX.
        shell: bash
        run: |
          set -eu
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo >/dev/null
          useradd -m -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          (cd /srv/release && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &) || true
          sleep 1
          pep668=$([ "$DISTRO" = humble ] || echo PIP_BREAK_SYSTEM_PACKAGES=1)
          su - tester -c "env -i HOME=/home/tester USER=tester $pep668 \
              PATH=/home/tester/.local/bin:/usr/local/bin:/usr/bin:/bin bash -c '
            python3 -m pip install -q --user --no-index --find-links /tmp/wheels scensim
            scensim setup --autoware none' " > /tmp/setup.txt 2>&1 || true
          cat /tmp/setup.txt
          for want in "ok   system packages (rosdep)" "ok   scensim answers"; do
            grep -qF "$want" /tmp/setup.txt || { echo "::error::setup check: no '$want'"; exit 1; }
          done
          if grep "FIX " /tmp/setup.txt | grep -v "DDS socket buffers"; then
            echo "::error::setup check: a FIX line (above)"; exit 1
          fi
          echo "scensim setup as a user: ok" >> "$GITHUB_STEP_SUMMARY"
      - name: A testbench
        if: inputs.journey
        shell: bash
        run: |
          set -eo pipefail   # not -u: ROS's setup files read unset variables
          source /opt/ros/$DISTRO/setup.bash
          source ~/.local/share/scensim/current/sim/setup.bash
          git config --global user.name "scensim release" && git config --global user.email release@example.org
          mkdir -p ~/ws/src && cd ~/ws/src
          scensim testbench new my_testbench
          cd ~/ws && colcon build --symlink-install --event-handlers console_cohesion- summary+
          source install/setup.bash
          scensim testbench list | tee /tmp/list.txt
          grep -q '^my_testbench' /tmp/list.txt
          echo "testbench new, colcon build, testbench list: ok" >> "$GITHUB_STEP_SUMMARY"

  # Trusted publishing to PyPI, one GitHub environment per project: PyPI refuses a second
  # pending publisher with the same (repository, workflow, environment) for another project
  # name. Dependencies go first, so scensim never stands on PyPI without the
  # scensim-ros-humble it pins: scensim-ros-humble (environment pypi-scensim-ros-humble, the
  # user's approval), then colcon-scensim, then scensim. Each job uploads only its own wheel,
  # from the `wheels` artifact. No TestPyPI (the user, 2026-11-18): `after` checks the first
  # public install instead.
  # The car's Autoware packages, as a user gets them (no vehicle tarball since 0.2.0): that
  # Autoware's binaries (NEWSLab's localrepo, CPU build; about 8 minutes), the job's simulation
  # tarball, autoware-side.repos at this commit's pin, built over that Autoware; then launch
  # resolution of the stock pilot and of autoware_sim_profile (docs/how-to/connect-autoware.md).
  autoware-side:
    needs: [preflight, build-sim]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: humble, autoware: 1.5.0, deb: 1.5.0-humble-4/autoware-localrepo-1-5-0_1.5.0-4ubuntu2204cpu_all.deb}
          - {distro: humble, autoware: 2.1.0, deb: 2.1.0-1/autoware-localrepo-2-1-0_2.1.0-1ubuntu2204cpu_all.deb}
          - {distro: jazzy, autoware: 2.1.0, deb: 2.1.0-jazzy-1/autoware-localrepo-2-1-0_2.1.0-1ubuntu2404cpu_all.deb}
    runs-on: ubuntu-22.04
    env:
      DISTRO: ${{ matrix.distro }}
    container:
      image: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@v4
        with:
          name: tarballs-${{ matrix.distro }}
          path: /srv/release
      - name: Build and resolve against Autoware ${{ matrix.autoware }}
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          python3 scripts/release/autoware_side_repos.py -o /tmp/autoware-side.repos
          scripts/release/check_autoware_side.sh ${{ matrix.autoware }} \
            https://github.com/NEWSLabNTU/autoware-localrepo/releases/download/${{ matrix.deb }} \
            /srv/release/scensim-sim-$VERSION-$DISTRO-$ARCH.tar.zst /tmp/autoware-side.repos \
            autoware-side-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoware-side-${{ matrix.distro }}-${{ matrix.autoware }}
          path: autoware-side-out/*.log

  publish:
    needs: [preflight, links, smoke, autoware-side]
    if: needs.preflight.outputs.publish_ok == 'true' && inputs.stop_after == 'publish'
    runs-on: ubuntu-22.04
    environment: pypi-scensim-ros-humble   # the user's approval (required reviewer)
    permissions:
      contents: write      # the GitHub Release
      id-token: write      # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4   # tarballs-humble/, tarballs-jazzy/
        with: {pattern: tarballs-*, path: parts}
      - uses: actions/download-artifact@v4
        with: {name: wheels-humble, path: wheels}
      - name: Both tarballs and one SHA256SUMS
        run: |
          set -eu
          mkdir dist
          cp parts/*/*.tar.zst dist/
          cat parts/*/SHA256SUMS > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          [ "$(ls dist/*.tar.zst | wc -l)" = "$(echo $DISTROS | wc -w)" ] \
            || { echo "::error::want one tarball per distro ($DISTROS): $(ls dist)"; exit 1; }
      # The GitHub Release: drafted with the tarballs, then made public, all before the first
      # wheel goes up, so no published wheel ever names a file that is not served yet. A rerun
      # finds the draft (or the release) and uploads the tarballs again.
      - name: The GitHub Release, with the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -eu
          python3 - "$VERSION" > notes.md <<'EOF'
          import re, sys
          text = open("docs/release-notes.md").read()
          m = re.search(rf"^## v{re.escape(sys.argv[1])}\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(m.group(1).strip())
          EOF
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --draft --target "$SHA" --title "v$VERSION" --notes-file notes.md
          # the car's Autoware packages, as source at this commit's pin (no vehicle tarball)
          python3 scripts/release/autoware_side_repos.py -o dist/autoware-side.repos
          gh release upload "v$VERSION" dist/*.tar.zst dist/SHA256SUMS dist/autoware-side.repos --clobber
          gh release edit "v$VERSION" --draft=false
      - name: scensim-ros-humble's wheel only
        run: scripts/release/one_wheel.sh wheels scensim-ros-humble upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  publish-ros-jazzy:
    needs: [preflight, publish]   # after the user's gate, with the tarballs served
    runs-on: ubuntu-22.04
    environment: pypi-scensim-ros-jazzy
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with: {name: wheels-jazzy, path: wheels}
      - name: scensim-ros-jazzy's wheel only
        run: scripts/release/one_wheel.sh wheels scensim-ros-jazzy upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  publish-colcon:
    needs: [preflight, publish]
    runs-on: ubuntu-22.04
    environment: pypi-colcon-scensim
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with: {name: wheels-humble, path: wheels}
      - name: colcon-scensim's wheel only
        run: scripts/release/one_wheel.sh wheels colcon-scensim upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  publish-scensim:
    needs: [preflight, publish-colcon, publish-ros-jazzy]   # never before what it pins
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write      # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with: {name: wheels-humble, path: wheels}
      - name: scensim's wheel only
        run: scripts/release/one_wheel.sh wheels scensim upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  tag:
    needs: [preflight, publish-scensim]
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # the tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: The tag, last, on the built commit, once all three packages are up
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `publish` makes the GitHub Release with --target, which creates the tag itself
          # (run 44267937009: v0.1.0 was already at d90ac38). The tag on the built commit is
          # the goal, made here or there; a tag on any other commit is an error.
          at=$(git ls-remote origin "refs/tags/v$VERSION^{}" | cut -f1)
          [ -n "$at" ] || at=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
          if [ -z "$at" ]; then
            git tag -a "v$VERSION" "$SHA" -m "scensim $VERSION"
            git push origin "refs/tags/v$VERSION"
          elif [ "$at" = "$SHA" ]; then
            echo "v$VERSION is already at the built commit $SHA"
          else
            echo "::error::v$VERSION is at $at, not at the built commit $SHA"
            exit 1
          fi

  after:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-22.04
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - name: Install from PyPI, the real first run
        run: |
          set -o pipefail
          # Python 3.12 (Jazzy) is externally managed (PEP 668): a --user install needs the flag
          flag=""; [ "$DISTRO" = humble ] || flag=--break-system-packages
          docker run --rm ros:$DISTRO bash -c "
            set -e
            apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null
            # PyPI's index can lag a publish by seconds to minutes (0.2.0's after (jazzy) did not
            # see colcon-scensim 0.2.0 yet): retry 5 x 30 s before calling it a failure
            for i in 1 2 3 4 5; do
              python3 -m pip install -q --user --no-cache-dir $flag scensim==$VERSION colcon-scensim==$VERSION && break
              [ \$i = 5 ] && exit 1
              echo \"pip install failed (try \$i of 5), retrying in 30 s for PyPI's index\"; sleep 30
            done
            ~/.local/bin/scensim install && ~/.local/bin/scensim --version" 2>&1 | tee out.txt
          { echo "### After ($DISTRO)"; echo '```'; tail -20 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
