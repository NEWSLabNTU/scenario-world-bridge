[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scensim-ros-humble"
version = "0.2.1"
description = "Where the prebuilt scensim for ROS 2 Humble is: each artefact's URL, size and sha256"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scensim_ros_humble = ["manifest.json"]
