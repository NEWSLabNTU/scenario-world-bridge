[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scensim-ros-jazzy"
version = "0.1.0"
description = "Where the prebuilt scensim for ROS 2 Jazzy is: each artefact's URL, size and sha256"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scensim_ros_jazzy = ["manifest.json"]
