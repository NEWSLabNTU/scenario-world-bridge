# basic: the starter scenarios of scensim_examples (scenarios/basic/) as a regression project
# (roadmap 077 step 4, inventory items 1-3). The scenarios stay where they are; the suites
# name them, by pkg:// (081 step 4).
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01, Town02, Town03, Town05, Town10]
pilots:
  ego: {kind: autoware, autoware_profile: scensim, vehicle: tesla_model3}
logging:
  keep: {passed: result, failed: full, error: full}
judges:
  # CARLA's own contacts joined into the run's JUnit (roadmap 021), as run_suite
  # --physical-verdict did for these
  - name: physical_verdict
    run: [ros2, run, scensim_launch, physical_verdict, "{run_dir}/junit.xml", --scenario, "{scenario}"]
default: town01   # the suite `scensim run basic` runs
