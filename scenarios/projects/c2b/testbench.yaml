# c2b: roadmap 074 C2b, the scensim check of the arena, as a project (077 step 4, inventory item
# 32). Two light-policy cars, coop_a cutting in ahead of coop_b on Town03's east straight, each
# a `command` pilot (pilots/cutin_pilot.py over scripts/coop/cutin_agent.py, no Autoware),
# started per run with the run's rule pair; the judge scores each run as the arena does and
# compares it with the arena's runs of its cell (074 D2).
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town03]
pilots:
  coop_*:
    kind: command
    vehicle: tesla_model3
    lifetime: run
    run: [python3, pilots/cutin_pilot.py, --pair, "{param:pair}"]
    inputs: [ground_truth]
judges:
  - name: c2b_score
    run: [python3, judges/c2b_score.py]
  - name: physical_verdict
    run: [ros2, run, scensim_launch, physical_verdict, "{run_dir}/junit.xml", --scenario, "{scenario}"]
default: c2b   # the suite `scensim run c2b` runs
