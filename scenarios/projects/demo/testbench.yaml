# demo: the demo incidents of scensim_examples (scenarios/demo/incidents/) as a regression project
# (roadmap 077 step 4, inventory items 8-10). Each incident is judged by incident_judge, by its
# row of roadmap 033's table, over the run's gap trace and its storyboard log.
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]
pilots:
  ego:
    kind: autoware
    vehicle: tesla_model3
    # the demo tour's ego (inventory item 11), which the incidents are timed for since
    # 2026-10-20 (62eae3c: route C at 40 km/h); at the profile's default 4.17 m/s i1's lead
    # outruns the ego and brakes 100 m ahead of it
    args: {max_velocity: 11.11, lidar_detection_model: centerpoint,
           use_multi_channel_tracker_merger: false}
    lifetime: stack          # one Autoware for the suite: its detector loads once
world:
  weather: ClearNoon        # the demo tour's (033); the incidents are timed for the tour
logging:
  keep: {passed: result, failed: full, error: full}
judges:
  # the incident's number from the scenario's name (town01_i<N>_...); a scenario with no row
  # in incident_judge's table records an error here, and SSv2's verdict stands
  - name: incident
    run: [python3, -m, scensim.gap, incident, --incident, auto, --context, context.jsonl]
    needs: [gap_trace, context]
  - name: physical_verdict
    run: [ros2, run, scensim_launch, physical_verdict, "{run_dir}/junit.xml", --scenario, "{scenario}"]
default: incidents   # the suite `scensim run demo` runs
