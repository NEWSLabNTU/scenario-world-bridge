# world stepped in lockstep with NDT's pose, as aib's ego_drift_mustang.yaml (roadmap 057, lap
# 32). Paths are relative to this file. The domain follows the stack's EGO_ROS_DOMAIN_ID.
rig: ../../../../src/autoware_isaac_bridge/src/aib/config/drift_mustang.rig.yaml
domain: 1
node_name: isaac_vehicle
control_topic: /control/command/drift/control_cmd
lockstep: {topic: /localization/pose_estimator/pose_with_covariance, timeout_s: 1.0}
vehicle: {}
ecu: {}
sensors: {}
