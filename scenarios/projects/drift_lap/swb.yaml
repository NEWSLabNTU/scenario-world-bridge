# drift_lap: a lap of Town05's ring in drift_mustang on Isaac Sim, Autoware driving at up to
# 100 km/h and autoware-drift's drift_controller taking the bends (roadmap 057; 077 step 4,
# inventory item 25). The reference is lap 32 (2026-10-28): a full lap, one drift (the NE
# bend), no contact. autoware-drift is a workspace of its own, named on each host:
# workspaces: {autoware-drift: <its checkout, built>} in ~/.config/swb/host.yaml (G60).
#
# Deferred (077, 2026-11-16): needs a quiet GPU. On newslab-server139, with another user's job
# holding the GPU at 97 %, Isaac ran at 0.16x real time (240 Hz physics and the render), so
# SSv2's 760 s wall timeout came inside its 300 s simulated initialize_duration: the car never
# moved (runs 2026-11-16T17-40-09, a first Step of 18 s past the bridge's 10 s, and
# T17-41-33). G60 verified live there: drift_controller ran from the overlay, its commit
# recorded. Lap 32 ran at a host load of about 50 on server-241. G61: the run's limits are
# wall seconds, sized for a real-time factor of 1.
simulator: isaac
assets:
  - dataset: carla-town-autoware-maps
    take: [Town05]
  - dataset: carla-0.9.16-isaac-usd
    take: [Town05, vehicles/vehicle.ford.mustang, "vehicles/*.json"]
pilots:
  ego:
    kind: autoware
    vehicle: drift_mustang
    lifetime: stack
    overlays: ["{workspace:autoware-drift}/install/setup.bash"]
    # autoware-drift's README, "The first approach": what Autoware needs to tolerate a drift
    # (its docs/autoware-in-a-drift.md says why each)
    args:
      max_velocity: 27.78
      extra_launch: "{workspace:autoware-drift}/install/drift_launch/share/drift_launch/\
        launch/drift.launch.xml"
      velocity_smoother_param_path: "{workspace:autoware-drift}/install/drift_launch/share/\
        drift_launch/config/velocity_smoother.param.yaml"
      diagnostic_graph_path: "{workspace:autoware-drift}/install/drift_launch/share/\
        drift_launch/config/diagnostics/drift.yaml"
      planning_common_param_base: "{workspace:autoware-drift}/install/drift_launch/share/\
        drift_launch/config/common.param.yaml"
      vehicle_cmd_gate_param_path: "{workspace:autoware-drift}/install/drift_launch/share/\
        drift_launch/config/vehicle_cmd_gate.param.yaml"
      launch_lane_departure_checker: false
      launch_autonomous_emergency_braking: false
      launch_control_validator: false
isaac:
  ego: config/ego_drift_mustang.yaml   # the drift controller's Control, NDT lockstep
  physics_hz: 240
ssv2:
  frame_rate: 100                      # a 10 ms step (lap 32)
  initialize_duration: 300
logging:
  capture: full
  topics:
    - /drift/state
    - /localization/kinematic_state
    - /vehicle/status/velocity_status
    - /control/command/control_cmd
    - /control/command/drift/control_cmd
    - /planning/scenario_planning/trajectory
    - /api/planning/velocity_factors
    - /api/fail_safe/mrm_state
  keep: {passed: standard, failed: full, error: full}
judges:
  - name: drift_lap
    run: [python3, judges/drift_lap.py, --min-drifts, "1"]
