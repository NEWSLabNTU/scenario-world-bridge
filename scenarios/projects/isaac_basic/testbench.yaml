# isaac_basic: the basic ego drives on Isaac Sim (roadmap 077 step 4, inventory item 16),
# Autoware on aib's rig. The scenarios stay where they are (scensim_examples' scenarios/basic/);
# the suites name them. Town02 is preloaded, so one stack serves both towns.
simulator: isaac
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01, Town02]
  - dataset: carla-0.9.16-isaac-usd
    take: [Town01, Town02, vehicles]
isaac:
  preload: [Town02]
pilots:
  ego: {kind: autoware, vehicle: tesla_model3}
logging:
  keep: {passed: result, failed: full, error: full}
default: towns   # the suite `scensim run isaac_basic` runs
