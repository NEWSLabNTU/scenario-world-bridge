# 050's tour group: incidents i1 to i6 (i7 and i8 came later and are not in it) and the
# six-incident tour, on the tour's Autoware (this project's swb.yaml). Reference, 050's
# "after" (2026-10-23): all pass; no ego contact; oracle as "before" (i2 0/0/4, i6 0/0/1,
# the tour 0/1/21). Measured here (2026-11-16): i1 to i6 as the reference. The tour, on
# CARLA's blueprint physics (a project stack's tesla_model3 before 077 G55), passed in SSv2
# but touched a light prop (static.prop.mesh) on the straight at y -195 in 2 of 2 runs,
# failing both judges; on the spec's physics (G55's default) 0 of 2, then 1 of 2 with 83da98a.
# Not the physics: Town01's movable map props, which the world server did not freeze, were
# knocked into the road by the tracked NPC g_close_1, so a contact was chance (077 G58, fixed
# in swb_carla_world 8b90053; the tour's reruns on it are G58's follow-up).
scenarios:
  - ../../../src/scensim_examples/scenarios/demo/incidents/town01_i1_lead_brake.xosc
  - ../../../src/scensim_examples/scenarios/demo/incidents/town01_i2_ped_dart.xosc
  - ../../../src/scensim_examples/scenarios/demo/incidents/town01_i3_red_light.xosc
