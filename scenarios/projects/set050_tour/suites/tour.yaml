  - ../../../src/scensim_examples/scenarios/demo/incidents/town01_i5_cross_turn.xosc
  - ../../../src/scensim_examples/scenarios/demo/incidents/town01_i6_cyclist_inside.xosc
  - ../../../src/scensim_examples/scenarios/demo/town01_tour.xosc
