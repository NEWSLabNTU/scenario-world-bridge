# set050_tour: the tour group of roadmap 050's measurement set (see ../set050), on the tour's
# Autoware: 40 km/h, CenterPoint, the single-channel tracker merger. Its own project because
# the ego's arguments are the stack's: `lifetime: stack` builds or loads CenterPoint's engines
# once, before any run, where `lifetime: run` would start Autoware, and its engines, for each
# run (077 G54: a pilot counts as ready before its perception is).
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]
pilots:
  ego:
    kind: autoware
    vehicle: tesla_model3
    args: {max_velocity: "11.11", lidar_detection_model: centerpoint, use_multi_channel_tracker_merger: "false"}
logging:
  gap_trace: true
  keep: {passed: standard, failed: full, error: full}
judges:
  - name: physical_verdict
    run: [ros2, run, swb_launch, physical_verdict, "{run_dir}/junit.xml", --scenario, "{scenario}"]
  - name: gap
    run: [python3, -m, swb.gap, oracle]
    needs: [gap_trace]
