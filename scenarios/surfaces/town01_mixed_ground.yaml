# A proof run's ground (town01_mixed_ground.xosc): Town01's west road, its southbound lane
# (x -4..0) wet asphalt with puddles over y -121.6..-89.6, then three soil zones on the grid
# with their own ground (tiles on whole 1.6 m), dry asphalt between: sand, dirt (sandy loam)
# and wet mud. Mud's soil parameters are a stand-in (a wet clay row, 047 D6), so the map opts
# in by name. Copy to data/carla-autoware-bridge/Town01/surfaces.yaml for a run.
allow_unvalidated: [mud_wet]
defaults: {Road: asphalt, RoadLine: asphalt, SideWalk: concrete, Terrain: grass, Ground: dirt}
zones:
  - id: wet_lane
    class: asphalt
    wetness: wetWithPuddles
    polygon: [[-4.0, -121.6], [0.0, -121.6], [0.0, -89.6], [-4.0, -89.6]]
  - id: sand_lane
    class: sand
    soil: grid
    ground_z: 0.0
    polygon: [[-4.0, -153.6], [0.0, -153.6], [0.0, -129.6], [-4.0, -129.6]]
  - id: dirt_lane
    class: dirt
    soil: grid
    ground_z: 0.0
    polygon: [[-4.0, -185.6], [0.0, -185.6], [0.0, -160.0], [-4.0, -160.0]]
  - id: mud_lane
    class: mud_wet
    soil: grid
    ground_z: 0.0
    polygon: [[-4.0, -217.6], [0.0, -217.6], [0.0, -192.0], [-4.0, -192.0]]
