# T3, live regression (roadmap 077): the migrated studies' suites, each against the reference
# result recorded on the release commit. scripts/t3.py runs them (`run`), records the
# references (`record`) and compares a host's latest results with them (`compare`).
#
# Each entry: project (a directory holding swb.yaml), suite (under its suites/), sim, and
# what the host needs; minutes, a rough wall time with the stack's start, splits the set
# across hosts (`--part i/n`); `part: k, parts: n` pins a project to host k of n (the
# release runs' assignment, 2026-11-16: 1 swb 118, 2 swb 241, 3 swb 243) (`long: true`: tens of minutes). c2b, e2 and s5 reach into scripts/coop:
# they run in this repository, never a copy. A scenario expected to fail says so in its suite's `expect:`, so the
# suite still exits 0 on it; the reference records the verdict either way.
references: scenarios/t3-references
suites:
  # CARLA 0.9.16, one GPU host
  - {project: scenarios/projects/basic, suite: town01, sim: carla, part: 2, parts: 3, minutes: 10}
  - {project: scenarios/projects/basic, suite: towns, sim: carla, part: 2, parts: 3, minutes: 12}
  - {project: scenarios/projects/basic, suite: episode_change, sim: carla, part: 2, parts: 3, minutes: 4}
  - {project: scenarios/projects/basic, suite: tutorial, sim: carla, part: 2, parts: 3, minutes: 4}
  - {project: scenarios/projects/two_av, suite: two_av, sim: carla, part: 1, parts: 3, minutes: 15}
  - {project: scenarios/projects/demo, suite: incidents, sim: carla, part: 3, parts: 3, minutes: 15, needs: [tensorrt]}
  - {project: scenarios/projects/demo, suite: i6_centerpoint, sim: carla, part: 3, parts: 3, minutes: 6, needs: [tensorrt]}
  - {project: scenarios/projects/demo, suite: cut_in_rear, sim: carla, part: 3, parts: 3, minutes: 7, needs: [tensorrt]}
  - {project: scenarios/projects/demo, suite: tour, sim: carla, part: 3, parts: 3, minutes: 13, needs: [tensorrt]}
  - {project: scenarios/projects/gap, suite: gap, sim: carla, part: 2, parts: 3, minutes: 15}
  - {project: scenarios/projects/bench, suite: bench, sim: carla, part: 2, parts: 3, minutes: 10}        # no Autoware; frame_budget p95 <= 10 ms
  - {project: scenarios/projects/set050, suite: default, sim: carla, part: 2, parts: 3, minutes: 20}     # truck_pass expected failed
  - {project: scenarios/projects/set050, suite: bench, sim: carla, part: 2, parts: 3, minutes: 10}       # npc_20
  - {project: scenarios/projects/set050, suite: two_av, sim: carla, part: 2, parts: 3, minutes: 15}      # two Autoware stacks
  - {project: scenarios/projects/set050_tour, suite: tour, sim: carla, part: 1, parts: 3, minutes: 25, needs: [tensorrt], long: true}  # ~20 min
  - {project: scenarios/projects/c2b, suite: c2b, sim: carla, part: 3, parts: 3, minutes: 40}
  - {project: scenarios/projects/s5, suite: s5, sim: carla, part: 1, parts: 3, minutes: 30, needs: [tensorrt], long: true}  # one 7 s run fails physical_verdict as expected
  - {project: scenarios/projects/e2, suite: e2, sim: carla, part: 1, parts: 3, minutes: 10}
  - {project: src/swb_examples/projects/safety_suite, suite: nightly, sim: carla, part: 1, parts: 3, minutes: 55, copy: true}
  - {project: src/swb_examples/projects/multi_pilot, suite: cut_in_seeds, sim: carla, part: 3, parts: 3, minutes: 15, copy: true}
