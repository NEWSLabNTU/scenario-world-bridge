  explain:
    title: Explanations (C4)
    explain: true
    notes:
      - "C4: the cut-in's measured play explained by five models over C1's 9 profiles, on the arena's tables (v_B 12, 171 cells, 4 seeds, every profile on shared seeds): selfish logit QRE, SVO QRE (phi_A, phi_B), a potential (alpha: the weight of U_B against U_A), level-k (Poisson tau), and the kappa threshold rules (A's belief p0 that B yields against the table's kappa; B's belief q0 and courtesy c_B)."
      - "Play: the observed outcome per run (A ahead / behind / not in / contact, x B braked). Identifiability: profile likelihood (LR 95 %) and a cell bootstrap; held-out: 5-fold over cells, payoff RMSE (clipped at -2) and log loss per run."
      - "The merge-end fix (arena.py): do6's final table with the legacy end and the fix on the same runs; do7 and the refits are under the cut-in."
