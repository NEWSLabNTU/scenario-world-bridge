      - "C5: C1's cut-in with measured capabilities. m3: the spec's Model 3 (E1: 0-12 m/s 4.7 m/s^2 mean, full braking 9.6 peak). hgv: CARLA 0.9.16 vehicle.carlamotors.european_hgv, stock physics (E4: 7000 kg, 7.94 x 2.89 m, 1.38 m/s^2, braking 3.22 mean / 4.56 peak, 22.4 m from 12 m/s). fire: vehicle.carlamotors.firetruck (10 t, 1.13 m/s^2, 2.78 / 3.67, 26.0 m). hgv3: the hgv with the Model 3's 3 s lane change (the heavy cars' 4 s is assumed). golf: TYPES' golf cart (assumed), at v_B 6."
      - "The commitment hypothesis (a car that cannot brake hard, or accelerate, is yielded to) against the Model 3 in the weak car's role: the weak car is yielded to in 1-13 more contexts of 629 than the Model 3 and in 2-7 fewer elsewhere; where it pays, the gentler 4 s lane change pays (hgv3: 0 contexts). Not supported."
