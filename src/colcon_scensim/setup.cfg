[metadata]
name = colcon-scensim
version = 0.1.0
description = colcon's scensim_testbench build type: a scensim testbench, package.xml and testbench.yaml, no CMake
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
keywords = colcon, scensim

[options]
packages = find:
install_requires =
    colcon-core>=0.12
    colcon-ros
python_requires = >=3.8
zip_safe = false

[options.packages.find]
exclude = test, test.*

[options.entry_points]
colcon_core.task.build =
    ros.scensim_testbench = colcon_scensim.task.build:TestbenchBuildTask
colcon_core.task.test =
    ros.scensim_testbench = colcon_scensim.task.test:TestbenchTestTask
