# The protocol's parameters (docs/design/conflict-zone-protocol.md, "Parameters"). Every entry has a
# value and a source: `assumed` (the design's assumed table, to be measured in roadmap 078 Phase 2) or
# the run that measured it. `heldout` is the held-out error once measured (Phase 2), null until then.
role_time_error_e:        {value: 0.55, unit: s, source: "078 P2 EV4, held out, pooled 0-30 m (Autoware 1.5.0 tracks vs scensim truth, Town05 j979; held-out e99 0.53 s rounded up; was 074 C8 arena e99 0.25)", heldout: 0.53}
arrival_bias:             {value: -0.24, unit: s, source: "078 P2 EV4, held out, pooled 0-30 m (reading - truth of the other's arrival in the entry band: the track predicts it 0.24 s early, its speed lag while it brakes; corrected = reading - bias, 0.24 s later); 078 P2b held out -0.25; the arena adapter sets its own", heldout: -0.24}
rest_stamp_bias:          {value: 0.7,  unit: s, source: "078 P2 (reading - truth of the other's rest stamp: the stop instant from Autoware's tracks comes 0.7 s late, median, 0.45-3.55 s; corrected = stamp - bias, 0.7 s earlier); orders stopped_first only (078 P2c ruling): rest_tie's and the fresh-rest guards, the claim and the second round's epoch read the raw stamp, a correction may only lengthen a guard; the arena adapter sets its own", heldout: null}
tie_threshold_T:          {value: 0.5,  unit: s, source: "074 U3 (TIE)", heldout: null}
tie_margin_m:             {value: 0.3,  unit: s, source: "074 C8 V1: m >= e; m 0.3 for e 0.25", heldout: null}
second_round_H2:          {value: 2.0,  unit: s, source: "074 C8 V1: H2 >= e + 1.2 s", heldout: null}
last_resort_extra:        {value: 1.7,  unit: s, source: "074 C8 (e): H3 = H2 + T + m + e + 1.7 s", heldout: null}
stop_dwell:               {value: 1.0,  unit: s, source: "074 U3 (STOP_DWELL); the law's full stop", heldout: null}
zone_guard_margin:        {value: 0.5,  unit: s, source: "074 C8 (FM_ZONE_MG)", heldout: null}
band_margin:              {value: 1.0,  unit: s, source: "assumed: 074 C7's conflict window |dt| <~ 1 s (the interval test: exit before entry)", heldout: null}
band_margin_entry:        {value: 0.2,  unit: s, source: "074 S2 / S4: the tie band |dt| <= 0.2 s (the entry test: arrival order)", heldout: null}
merge_horizon:            {value: 1.5,  unit: s, source: "074 S3: half the 3 s lane change (the merging car half across); 078 S3 fix", heldout: null}
merge_headway:            {value: 0.6,  unit: s, source: "074 S3: the tightest gap acceptance (tau 0.6 s); 078 S3 fix", heldout: null}
far_distance:             {value: 60.0, unit: m, source: "074 C8 (fcfsm's far test)", heldout: null}
far_time:                 {value: 2.0,  unit: s, source: "074 C8 (fcfsm's far test)", heldout: null}
rest_speed:               {value: 0.1,  unit: m/s, source: "074 U3 (a car below this at its line is at rest)", heldout: null}
rest_window:              {value: 2.0,  unit: m, source: "074 U3 (at rest within 2 m before the line)", heldout: null}
own_rest_window:          {value: 4.5,  unit: m, source: "078 P2c: the own car at rest within this of the zone is at its line; Autoware's intersection stop line at Town05 j979 sits 2.7-3.2 m before czp's zone edge and the car rests 0.6 m before it (czp s_entry 3.27 m, 3.79 m), so with rest_window (2 m) its rest never registered and rest_tie never bound (078 P2b on_dt-0.3_s0, P2c on_dt-0.3_s0)", heldout: null}
moved_speed:              {value: 0.5,  unit: m/s, source: "074 C8 (moved off its line: speed and 0.3 m)", heldout: null}
moved_dist:               {value: 0.3,  unit: m, source: "074 C8", heldout: null}
moved_dist_alone:         {value: 1.0,  unit: m, source: "074 C8 (distance alone)", heldout: null}
see_delay:                {value: 1.5,  unit: s, source: "074 C8 (FM_SEE): a start is seen 0.7 s (visible motion) + 0.8 s (perception and decision) after it", heldout: null}
guard_extra:              {value: 0.0,  unit: s, source: "078 P2g: added to every guard counted from a rest (rest_guard); 0 in use, the experiments' knob", heldout: null}
probe_first_moving:       {value: true, unit: bool, source: "078 V2b: a first go from rest while another car is still coming is probed too (stock reads a car at rest as static)", heldout: null}
fresh_rest_guard:         {value: true, unit: bool, source: "078 V2b: a first go waits until a car that only just stopped would be seen starting (against cars that ignore arrival order); 078 P2e: every go against a car at rest (rest_tie, clear, first, a tie) counts it from the later of the two rests, and a tie needs the own car at rest or past its commit point", heldout: null}
guard_filter_n:           {value: 2,    unit: samples, source: "074 C8 V3: filter the guards over 2-3 samples (141 flips unfiltered at noise x2)", heldout: null}
latch_s:                  {value: 1.0,  unit: s, source: "design R10: decisions latched >= 1 s", heldout: null}
mode_hold:                {value: 1.5,  unit: s, source: "078 P2b: RTC stays manual until the decision has been stock-equivalent this long (following the module's own safe meanwhile); 078 P2: 50 of 90 auto spells between manual ones were <= 1.0 s, 64 <= 1.5 s; 1.5 s = see_delay, past latch_s", heldout: null}
own_base_to_centre:       {value: 1.416, unit: m, source: "sim_vehicle_spec tesla_model3 geometry: (wheel_base 3.005 + front_overhang 0.807 + rear_overhang 0.980) / 2 - rear_overhang; Autoware's kinematic_state is base_link (the rear axle), czp's own pose the centre (078 P2b: measured 1.38 m on scensim)", heldout: null}
go_latch_launch:          {value: true, unit: bool, source: "074 C8 V3: a go is latched for the launch dead time", heldout: null}
go_latch_motion_timeout:  {value: 3.0,  unit: s, source: "078 P2c: a go from rest is held over soft re-reads until the car moves (> moved_speed), at most this long; Autoware takes about 1.4 s from ACTIVATE at rest to motion (078 P2b), the 0.5 s launch latch let a band re-read flip the go first", heldout: null}
probe_creep_dist:         {value: 0.5,  unit: m, source: "074 C8: the legible probe, creep about 0.5 m", heldout: null}
probe_watch:              {value: 1.5,  unit: s, source: "078 P2g: = see_delay; the other's start was seen up to 1.1 s after its first motion on the crossing (median 0.8); 0.8 s (C8's assumption) left 20-27 contacts per 360 in the screen", heldout: null}
probe_watch_speed:        {value: 0.4,  unit: m/s, source: "assumed (078 V2b): the car keeps rolling while it watches; at rest stock reads it as static again", heldout: null}
probe_stop_margin:        {value: 0.1,  unit: m, source: "issue 069: a creep is asked to stop this far + probe_stop_time x speed before the zone; the envelope of 15 creeps stopped in 078 P2g's grid and its rerun (requested at 0.06-0.20 m/s, travel 0.04-0.25 m)", heldout: null}
probe_stop_time:          {value: 1.0,  unit: s, source: "issue 069: with probe_stop_margin; Autoware accelerates about 0.4 s after the request, then brakes; above 0.2 m/s extrapolated", heldout: null}
creep_speed:              {value: 1.0,  unit: m/s, source: "assumed (design: creep 1 m/s)", heldout: null}
creep_timeout:            {value: 3.0,  unit: s, source: "assumed (design: a creep that gains nothing in 3 s steps down)", heldout: null}
yield_decel:              {value: 0.5,  unit: m/s^2, source: "assumed (C3's onset + 1.0 s): a yield is <= -0.5 held 0.5 s", heldout: null}
yield_hold:               {value: 0.5,  unit: s, source: "assumed", heldout: null}
yield_window:             {value: [0.5, 1.5], unit: s, source: "assumed", heldout: null}
critical_gap:             {value: 6.5,  unit: s, source: "assumed: the literature's 4.5-7 s; S5's band", heldout: null}
wet_factor:               {value: 0.6,  unit: ratio, source: "078 EV8 (swb 118, 9e9d4f0): lowest measured wet/dry ratio 0.60, wet = friction x 0.6 (CARLA 0.9.16 ignores wetness)", heldout: null}
uwb_attest:               {value: [2.5, 0.06], unit: "m, ratio", source: "coop 118: a UWB range tightens an interval only within 2.5 m + 6 % of a track", heldout: null}
