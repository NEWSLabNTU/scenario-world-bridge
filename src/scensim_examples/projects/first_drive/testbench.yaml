# first_drive: one Autoware ego on CARLA's Town01, three scenarios.
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]
pilots:
  # scensim's Autoware profile: stock Autoware 1.5.0 fails pedestrian_crossing, as it drives
  # into the space of the pedestrian crossing in front of it (docs/how-to/connect-autoware.md).
  ego: {kind: autoware, autoware_profile: scensim, vehicle: tesla_model3}
default: all   # the suite `scensim run <testbench>` runs
