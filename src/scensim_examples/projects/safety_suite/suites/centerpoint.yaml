# The same use cases with Autoware's CenterPoint detector (the full model, the profile's
# choice for lidar_detection_model:=centerpoint) instead of clustering. Both pass every
# variant (2026-11-16: UC-ACC-001-0001 27/27, UC-AEB-001-0001 9/9). With centerpoint_tiny,
# which the name meant before 2026-11-15, UC-AEB passed only 2 of 9 (roadmap 020): a failure
# here is news again.
scenarios: [scenarios/awf/]
pilot_args:
  ego: {lidar_detection_model: centerpoint}
expect: {}
retry: {on: error, times: 1}
logging:
  # a failure needs its logs, not a rosbag
  keep: {passed: result, failed: standard, error: full}
