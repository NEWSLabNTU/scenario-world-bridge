# safety_suite: the Autoware Foundation's ODD use cases (ACC, AEB) as a nightly suite on CARLA.
simulator: carla
assets:
  - dataset: carla-town-autoware-maps
    take: [Town01]           # both use cases are written for Town01
pilots:
  ego:
    kind: autoware
    vehicle: tesla_model3
    args: {lidar_detection_model: clustering}   # UC-AEB: 9/9 with clustering, 2/9 with centerpoint
    lifetime: run            # Autoware afresh for each use case, so a suite can swap its detector
logging:
  capture: standard
  keep: {passed: result, failed: full, error: full}
judges:
  # CARLA's own contacts joined into the run's JUnit (roadmap 021): a run where the ego
  # touched something SSv2's boxes did not see fails here.
  - name: physical_verdict
    run: [ros2, run, swb_launch, physical_verdict, "{run_dir}/junit.xml"]
